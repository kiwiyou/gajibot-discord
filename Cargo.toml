[package]
name = "gajibot"
authors = ["kiwiyou@kiwiyou.dev"]
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.66"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "client"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
	"http1",
	"http2",
	"rustls-platform-verifier",
] }
hyper-util = { version = "0.1.20", features = [
	"client-legacy",
	"http1",
	"http2",
	"tokio",
] }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true, features = [
	"experimental_span_attributes",
	"experimental_metadata_attributes",
] }
opentelemetry-http = { version = "0.32.0", optional = true, default-features = false, features = [
	"hyper",
	"internal-logs",
] }
opentelemetry-otlp = { version = "0.32.0", optional = true, default-features = false, features = [
	"http-proto",
	"trace",
	"metrics",
	"logs",
	"internal-logs",
	"hyper-client",
] }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = [
	"rt-tokio",
	"experimental_metrics_periodicreader_with_async_runtime",
	"experimental_trace_batch_span_processor_with_async_runtime",
	"experimental_logs_batch_log_processor_with_async_runtime",
] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"

[dependencies.tokio]
version = "1.53.1"
default-features = false
features = ["rt-multi-thread"]

[features]
otel = [
	"opentelemetry",
	"opentelemetry_sdk",
	"opentelemetry-otlp",
	"opentelemetry-http",
	"opentelemetry-appender-tracing",
	"dep:tracing-opentelemetry",
]
opentelemetry = ["dep:opentelemetry"]
